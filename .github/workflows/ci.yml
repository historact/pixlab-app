name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Davix-pixlab-app
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pixlab
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: production
      PORT: 3005
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: pixlab
      ADMIN_PASS: ci-admin-path
      ADMIN_PASSWORD_HASH: '$2b$10$5B8nL8v2z2m3z8e6w4H49ux8Yp4rV.VySMfNE2fM3oweb95AY2Ymi'
      ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXP
      ADMIN_SESSION_SECRET: ci-admin-session-secret
      SUBSCRIPTION_BRIDGE_TOKEN: ci-bridge-token
      API_KEYS: ci-public-key
      PUBLIC_BASE_URL: http://127.0.0.1:3005
      INTERNAL_ALLOWED_IPS: 127.0.0.1/32
      REQUIRE_SIGNED_OUTPUT_URLS: 'true'
      SIGNED_URL_SECRET: ci-signed-url-secret
      SIGNED_URL_TTL_SECONDS: '900'
      H2I_BLOCK_PRIVATE_NETWORK: 'true'
      H2I_ALLOW_FILE_SCHEME: 'false'
      H2I_DNS_REBINDING_MODE: strict
      PUPPETEER_NO_SANDBOX: 'false'
      AUTO_RUN_MIGRATIONS: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: Davix-pixlab-app/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run migrations on empty DB
        run: npm run migrate

      - name: Verify schema integrity
        run: npm run verify-schema

      - name: Start API
        run: |
          node server.js > /tmp/pixlab.log 2>&1 &
          echo $! > /tmp/pixlab.pid
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1:3005/health >/dev/null; then
              break
            fi
            sleep 1
          done

      - name: Verify production checks
        run: npm run verify:prod

      - name: Smoke tests
        run: |
          curl -sSf http://127.0.0.1:3005/health >/dev/null
          curl -sSf -H "x-davix-bridge-token: ${SUBSCRIPTION_BRIDGE_TOKEN}" http://127.0.0.1:3005/internal/ping >/dev/null
          curl -sS -o /tmp/h2i.json -w "%{http_code}" \
            -X POST http://127.0.0.1:3005/v1/h2i \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${API_KEYS}" \
            --data '{"html":"<html><body>ci</body></html>","format":"png"}' | grep -E '^(200|201)$'

      - name: Ensure no pending migrations remain
        run: |
          node -e "const {getMigrationStatus,closePool}=require('./db');(async()=>{const s=await getMigrationStatus(); if(s.pending.length){console.error('Pending migrations:',s.pending); process.exit(1);} await closePool();})();"

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/pixlab.pid ]; then kill "$(cat /tmp/pixlab.pid)" || true; fi
          tail -n 200 /tmp/pixlab.log || true
